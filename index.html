      <div style="display:grid;gap:6px;min-width:0"><h2>${esc(p.name)}</h2>
        ${p.address ? `<div class="note">${esc(p.address)}</div>` : ''}
        <div class="links">
          <a class="btn small" href="${esc(mapsLink(p))}" target="_blank" rel="noopener">Googleマップ</a>
          <a class="btn small" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(p.lat != null ? p.lat + ',' + p.lng : p.name)}" target="_blank" rel="noopener">経路</a>
        </div></div></div>
    <div class="stampcard">
      <div class="top"><b>${n}</b>回${n ? `<span class="rank" style="color:var(--${ink})">${rankOf(n)}</span><span class="tally" style="color:var(--${ink});align-items:center">${tallyCount(n, 18, !!slamLast)}</span>` : ''}
        <span class="note" style="margin-left:auto">押印帳 ${cardNo}枚目${n && n % 10 === 0 ? '（満了！次の1回で新しいカード）' : ''}</span></div>
      <div class="slots">${n && n % 10 === 0 ? cells.replace('<div class="cell"><span class="ring"></span>&nbsp;</div>', '') : cells}</div>
      ${n && n % 10 === 0 ? `<button class="btn stampbtn" data-d="stamp">今日の印を押す</button>` : ''}
      <details><summary class="note" style="cursor:pointer">日付やメモを付けて記録する</summary>
        <div style="display:grid;gap:8px;padding-top:8px">
          <div class="joined" style="grid-template-columns:auto 1fr"><input type="date" class="inline-input" id="vDate" value="${today()}" max="${today()}"><input class="inline-input" id="vMemo" placeholder="食べたもの・ひとこと"></div>
          <input class="inline-input" id="vAmount" inputmode="numeric" placeholder="金額（円）">
          <button class="btn solid" data-d="visit">この内容で印を押す</button>
        </div></details>
    </div>
    <div class="field"><span>評価</span><div class="stars" id="dRate">${[1, 2, 3, 4, 5].map(i => `<button type="button" data-rate="${i}" class="${i <= p.rating ? 'on' : ''}" aria-label="星${i}">★</button>`).join('')}</div></div>
    <div class="field"><span>ジャンル（判子のインクの色が変わります）</span><div class="gchips" id="dGenres">${genreSet.map(g => `<button type="button" class="chip ${g === p.genre ? 'on' : ''}" data-genre="${esc(g)}">${esc(g)}</button>`).join('')}</div></div>
    <label class="field"><span>メモ（おすすめ、次に頼みたいもの）</span><textarea id="dMemo">${esc(p.memo)}</textarea></label>
    <label class="field"><span>タグ（カンマ区切り　例: デート, 個室, ランチ）</span><input id="dTags" value="${esc(p.tags)}"></label>
    ${vs.length ? `<div class="field"><span>これまでの来店${spentLabel(vs)}</span><div>${vs.map(visitRow).join('')}</div></div>` : ''}
    <details><summary class="note" style="cursor:pointer">店名・状態を変える／削除する</summary>
      <div style="display:grid;gap:10px;padding-top:10px">
        <label class="field"><span>店名</span><input id="dName" value="${esc(p.name)}"></label>
        <label class="field"><span>状態</span><select id="dStatus">
          <option value="visited" ${p.status === 'visited' ? 'selected' : ''}>行った</option>
          <option value="want" ${p.status === 'want' ? 'selected' : ''}>行きたい</option></select></label>
        <button class="btn danger" data-d="delete">このお店を削除</button>
      </div></details>
    <button class="btn big" data-d="close">とじる</button>`;
  if (!$('#detailDlg').open) $('#detailDlg').showModal();
  const editing = $('#veMemo');
  if (editing) editing.focus();
}

/** シートの入力欄を読み取って保存（入力のたびに自動保存） */
function saveDetail() {
  const p = placeById(detailId);
  if (!p) return;
  p.name = $('#dName').value.trim() || p.name;
  p.status = $('#dStatus').value;
  p.tags = $('#dTags').value.trim();
  p.memo = $('#dMemo').value;
  savePlace(p);
}

/* ========== イベント ========== */
function saveUi() { store('ui', { filter: ui.filter, sort: ui.sort, tag: ui.tag }); }

function switchTab(tab) {
  if (tab === ui.tab) return;
  const go = () => {
    ui.tab = tab;
    document.querySelectorAll('nav [data-tab]').forEach(x => x.classList.toggle('on', x.dataset.tab === tab));
    ['list', 'map', 'stats'].forEach(t => { $('#tab-' + t).hidden = t !== tab; });
    listAnim = tab === 'list';
    render();
    scrollTo(0, 0);
  };
  const order = ['list', 'map', 'stats'];
  document.documentElement.dataset.dir = order.indexOf(tab) < order.indexOf(ui.tab) ? 'back' : 'fwd';
  if (document.startViewTransition && !reduced) {
    const t = document.startViewTransition(go);
    [t.ready, t.finished].forEach(p => p.catch(() => {}));
  } else go();
}

document.querySelector('nav').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]');
  if (b) switchTab(b.dataset.tab);
});
$('#fab').onclick = () => openAdd();
$('#sync').onclick = () => { if (queue.length) flush(); else load(); };
$('#q').oninput = e => { ui.q = e.target.value; renderList(); };
$('#sort').onchange = async e => {
  ui.sort = e.target.value; saveUi();
  if (ui.sort === 'near' && !ui.pos) await ensurePosition();
  listAnim = true; renderList();
};
$('#shelf').onclick = async e => {
  const open = e.target.closest('[data-open]');
  if (open) return openDetail(open.dataset.open);
  if (e.target.id === 'nearBtn' && await ensurePosition()) {
    store('geoOk', true); // 次からは開いたときに自動でさがす
    renderList();
    if (!nearbyWants().length) toast(`${NEAR_METERS / 1000}km以内に行きたいお店はありません`);
  }
};
$('#seg').onclick = e => {
  const b = e.target.closest('[data-filter]');
  if (b && b.dataset.filter !== ui.filter) { ui.filter = b.dataset.filter; saveUi(); listAnim = true; norenPass = true; renderList(); }
};
$('#tags').onclick = e => {
  const b = e.target.closest('[data-tag]');
  if (b) { ui.tag = ui.tag === b.dataset.tag ? '' : b.dataset.tag; saveUi(); listAnim = true; renderList(); }
};
$('#list').onclick = e => {
  const act = e.target.closest('[data-act]');
  if (!act) return;
  if (act.dataset.act === 'add') return openAdd();
  const id = act.closest('.shop').dataset.id;
  if (act.dataset.act === 'visit') addVisit(id, { x: e.clientX, y: e.clientY }); else openDetail(id);
};
$('#locBtn').onclick = async () => {
  if (await ensurePosition() && map) {
    map.setView([ui.pos.lat, ui.pos.lng], 16);
    L.circleMarker([ui.pos.lat, ui.pos.lng], { radius: 7, color: '#fff', weight: 3, fillColor: '#1a73e8', fillOpacity: 1 }).addTo(markers).bindPopup('現在地');
  }
};
$('#wardBtn').onclick = () => { store('wardsOn', store('wardsOn') === false); renderWardLayer(visitIndex()); };
$('#fitBtn').onclick = () => { if (map && mapPts.length) map.fitBounds(mapPts, { padding: [40, 40], maxZoom: 16 }); };
$('#stats').onclick = e => {
  const open = e.target.closest('[data-open]');
  if (open) return openDetail(open.dataset.open);
  const st = e.target.closest('[data-stab]');
  if (st) { ui.stab = st.dataset.stab; renderStats(); scrollTo(0, 0); return; }
  const yr = e.target.closest('[data-year]');
  if (yr) return openYear(Number(yr.dataset.year));
  if (e.target.id === 'roulette') return spinRoulette();
  if (e.target.id === 'apiSave') {
    if ($('#apiInput').value.trim() && setApiUrl($('#apiInput').value)) location.reload();
    else toast('Apps Script のウェブアプリURL（' + API_PREFIX + '…/exec）を入れてください');
    return;
  }
  const read = e.target.closest('[data-read]');
  if (read) {
    const box = read.closest('[data-readout]').dataset.readout;
    read.parentElement.querySelectorAll('.sel').forEach(x => x.classList.remove('sel'));
    read.classList.add('sel');
    $(box).textContent = read.dataset.read;
  }
};

$('#addBody').addEventListener('click', async e => {
  if (e.target.id === 'addPaste') {
    try { $('#addLink').value = await navigator.clipboard.readText(); resolveAdd(); }
    catch (err) { $('#addLink').focus(); toast('入力欄を長押しして「ペースト」してください'); }
    return;
  }
  const b = e.target.closest('[data-add]');
  if (b) submitAdd(b.dataset.add, e);
});
$('#addBody').addEventListener('input', e => { if (e.target.id === 'addName') updateAddPreview(false); });
$('#addBody').addEventListener('paste', e => { if (e.target.id === 'addLink') setTimeout(resolveAdd, 0); });
$('#addBody').addEventListener('change', e => { if (e.target.id === 'addLink') resolveAdd(); });

$('#detailBody').addEventListener('click', e => {
  const p = placeById(detailId);
  const r = e.target.closest('[data-rate]');
  if (r) {
    const n = Number(r.dataset.rate);
    p.rating = p.rating === n ? 0 : n;
    document.querySelectorAll('#dRate button').forEach(b => b.classList.toggle('on', Number(b.dataset.rate) <= p.rating));
    return savePlace(p);
  }
  const g = e.target.closest('[data-genre]');
  if (g) {
    p.genre = p.genre === g.dataset.genre ? '' : g.dataset.genre;
    savePlace(p);
    return openDetail(detailId);
  }
  const b = e.target.closest('[data-d]');
  if (!b) return;
  const act = b.dataset.d;
  if (act === 'close') closeSheet($('#detailDlg'));
  else if (act === 'stamp') { addVisit(detailId, { x: e.clientX, y: e.clientY }); openDetail(detailId, true); }
  else if (act === 'visit') {
    addVisit(detailId, { date: $('#vDate').value || today(), memo: $('#vMemo').value.trim(), amount: parseAmount($('#vAmount').value), x: e.clientX, y: e.clientY });
    openDetail(detailId, true);
  } else if (act === 'editVisit') { editVisitId = b.dataset.id; openDetail(detailId); }
  else if (act === 'saveVisit') saveVisitEdit();
  else if (act === 'delVisit') { deleteVisit(b.dataset.id); openDetail(detailId); }
  else if (act === 'delete') {
    if (!deleteArmed) { deleteArmed = true; b.textContent = '本当に削除する（来店履歴も消えます）'; return; }
    deletePlace(detailId); closeSheet($('#detailDlg')); toast('削除しました');
  }
});
$('#detailBody').addEventListener('change', e => { if (['dName', 'dStatus', 'dTags', 'dMemo'].includes(e.target.id)) saveDetail(); });
document.querySelectorAll('dialog').forEach(d => {
  d.addEventListener('click', e => { if (e.target === d) closeSheet(d); });
  d.addEventListener('close', () => {
    d.querySelectorAll('#fx, #toast, #cele').forEach(el => layer().appendChild(el));
    if (d.id === 'detailDlg') editVisitId = null;
  });
});
$('#toastUndo').onclick = () => { $('#toast').classList.remove('show'); if (toastUndo) toastUndo(); };
$('#toastExtra').onclick = () => { $('#toast').classList.remove('show'); if (toastExtra) toastExtra.fn(); };

$('#yearBody').addEventListener('click', e => {
  const yr = e.target.closest('[data-year]');
  if (yr) return openYear(Number(yr.dataset.year));
  const open = e.target.closest('[data-open]');
  if (open) return openDetail(open.dataset.open);
  if (e.target.closest('[data-d="closeYear"]')) closeSheet($('#yearDlg'));
});

/* ========== 起動 ========== */
(async function init() {
  render();
  await load();
  if (ui.sort === 'near' || store('geoOk')) locate().then(renderList, () => {});
  // ?add=<Googleマップのリンク> で開かれたら登録画面を出す（ショートカット／ブックマークレット用）
  if (HAS_GAS) google.script.url.getLocation(loc => { if (loc.parameter.add) openAdd(loc.parameter.add); });
  else { const add = new URLSearchParams(location.search).get('add'); if (add) openAdd(add); }
})();
</script>
